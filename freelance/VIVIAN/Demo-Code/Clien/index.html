<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Buyambi Care — Client Demo</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div class="app">
            <header class="app-header">
                <div class="brand">
                    <div class="logo">❤</div>
                    <div>
                        <div class="title">Buyambi Care</div>
                        <div class="subtitle">Emergency Response</div>
                    </div>
                </div>
                <div class="header-actions">
                    <select id="lang" class="input small">
                        <option value="en">English</option>
                        <option value="lg">Luganda</option>
                        <option value="sw">Swahili</option>
                    </select>
                </div>
            </header>

            <main id="views">
                <!-- MAIN HELP SCREEN -->
                <section id="screen-help" class="screen">
                    <div class="card center">
                        <div class="small muted">If you cannot complete the form, press SOS</div>
                    </div>

                    <div class="card center">
                        <button id="btn-sos" class="circle danger">SOS</button>
                        <div class="muted small">Emergency SOS — bypass triage</div>
                    </div>

                    <div class="card center">
                        <button id="btn-help" class="circle primary">HELP</button>
                        <div class="muted small">Guided help — answer quick triage</div>
                    </div>

                    <div class="card">
                        <div class="form-row">
                            <label class="label">Pain level</label>
                            <div class="seg" id="pain">
                                <button data-val="mild" class="seg-btn">Mild</button>
                                <button data-val="moderate" class="seg-btn">Moderate</button>
                                <button data-val="severe" class="seg-btn">Severe</button>
                            </div>
                        </div>

                        <div class="form-row">
                            <label class="label">Can you stand?</label>
                            <div class="seg" id="stand">
                                <button data-val="yes" class="seg-btn">Yes</button>
                                <button data-val="help" class="seg-btn">With help</button>
                                <button data-val="no" class="seg-btn">No</button>
                            </div>
                        </div>

                        <div class="form-row">
                            <label class="label">Preferred hospital</label>
                            <div class="seg" id="hospital">
                                <button data-val="nearest" class="seg-btn">Nearest</button>
                                <button data-val="public" class="seg-btn">Public</button>
                                <button data-val="private" class="seg-btn">Private</button>
                            </div>
                        </div>

                        <div class="form-row small muted">
                            Location: <span id="loc">Detecting…</span>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 12px">
                            <button id="btn-continue" class="big">Continue</button>
                            <button id="btn-clear" class="outline">Clear</button>
                        </div>
                    </div>
                </section>

                <!-- VEHICLE SELECTION -->
                <section id="screen-vehicles" class="screen hidden">
                    <div class="card">
                        <div
                            style="
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                            "
                        >
                            <div style="font-weight: 700">Choose vehicle</div>
                            <div><button id="btn-back" class="outline">Back</button></div>
                        </div>
                    </div>

                    <div class="card vehicle-list" id="vehicles">
                        <!-- cards inserted by JS -->
                    </div>
                </section>

                <!-- LIVE TRACKING -->
                <section id="screen-tracking" class="screen hidden">
                    <div class="card">
                        <div style="display: flex; align-items: center; gap: 10px">
                            <div id="rider-photo" class="avatar">R</div>
                            <div>
                                <div id="rider-name" style="font-weight: 700">Responder</div>
                                <div id="rider-rating" class="small muted">★ 4.9</div>
                            </div>
                            <div style="margin-left: auto">
                                <span id="status-pill" class="pill">On the way — ETA 5 min</span>
                            </div>
                        </div>
                    </div>

                    <div class="card map-placeholder" id="live-map">Map (mock)</div>

                    <div class="card center">
                        <div class="small muted">Severity: <span id="sev-label">Mild</span></div>
                        <div style="display: flex; gap: 8px; margin-top: 10px">
                            <button id="btn-call-responder" class="outline">Call</button>
                            <button id="btn-message" class="outline">Message</button>
                        </div>
                    </div>
                </section>
            </main>

            <nav class="bottom">
                <button id="nav-help" class="nav-item active">Home</button>
                <button id="nav-vehicles" class="nav-item">Vehicles</button>
                <button id="nav-track" class="nav-item">Tracking</button>
            </nav>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
